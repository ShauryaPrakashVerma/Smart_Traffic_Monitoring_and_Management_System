<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="vh-100 overflow-hidden">
    <div class="container-fluid p-0 vh-100 d-flex flex-column">
        
      <!-- TOP NAV BAR -->
      <div class="row">
        <div class="col-12 bg-info p-4"></div>
      </div>

      <!-- Main App Area (Fills remaining height) -->
      <div class="row vh-100">
        <div class="col-2 bg-warning p-0 d-flex flex-column">
          <div class="row bg-danger p-3 mx-0"></div>
          <div class="row bg-success p-3 mx-0"></div>
          <div class="row bg-danger p-3 mx-0"></div>
          <div class="row bg-success p-3 mx-0"></div>

          <!-- logout -->
          <div class="row bg-danger p-3 mx-0 mt-auto"></div>
        </div>

        <!-- SCROLLABLE MAIN CONTENT -->
        <div class="col-10 bg-primary p-4"></div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
